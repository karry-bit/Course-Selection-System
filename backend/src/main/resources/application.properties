## Database connection
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/unicourse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:123456}

# JPA / schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL init scripts
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# JWT Configuration
# 在生产环境中，请通过环境变量设置安全的密钥
jwt.secret=${JWT_SECRET:default-secret-key-for-dev-only-change-in-production-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Admin Configuration
# 在生产环境中，请通过环境变量设置管理员凭据
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}

# Default Password for imported users
default.password=${DEFAULT_PASSWORD:123456}

# CORS Configuration
# 生产环境中设置为具体的域名，多个域名用逗号分隔
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}