## Database connection (defaults for local development)
# You can override via environment variables: JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/unicourse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:unicourse_user}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:change_me}

# JPA / schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ensure Spring runs SQL init scripts (development). Remove or change in production.
spring.sql.init.mode=always

server.port=8080
